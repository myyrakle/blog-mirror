apiVersion: v1
kind: Secret
metadata:
  name: blog-mirror-secret
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:password:5432/blog_mirror"
  NAVER_BLOG_ID: "your_naver_blog_id"
  GITHUB_REPO_PATH: "/data/blog"
  GITHUB_REMOTE_URL: "https://github.com/username/blog.git"
  GITHUB_USERNAME: "your_github_username"
  GITHUB_TOKEN: "ghp_your_personal_access_token"
  CRAWL_DELAY_MS: "1500"
  # Admin dashboard credentials. Set BOTH to enable auth, or omit BOTH to run
  # without it. Setting only one is rejected at startup rather than silently
  # leaving the admin API open.
  # Generate one with: openssl rand -base64 24
  WEB_USERNAME: "your_dashboard_username"
  WEB_PASSWORD: "your_dashboard_password"

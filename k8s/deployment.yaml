apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-mirror
  namespace: default
  labels:
    app: blog-mirror
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-mirror
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: blog-mirror
    spec:
      containers:
        - name: blog-mirror
          image: myyrakle/blog-mirror:v0.2.1
          imagePullPolicy: Always
          # `serve` runs the admin dashboard *and* the periodic sync in one
          # process, so a scheduled run and a dashboard-triggered run can never
          # write to the git checkout at the same time.
          args: ["serve", "--interval", "3600"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          envFrom:
            - secretRef:
                name: blog-mirror-secret
          volumeMounts:
            - name: blog-repo
              mountPath: /data/blog
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: blog-repo
          hostPath:
            # Replace with the host path where the GitHub Pages repo is cloned.
            path: /path/to/blog-mirror-clone
            type: Directory
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: blog-mirror
  namespace: default
  labels:
    app: blog-mirror
spec:
  selector:
    app: blog-mirror
  ports:
    - name: http
      port: 80
      targetPort: http
